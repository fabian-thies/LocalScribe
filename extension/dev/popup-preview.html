<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxbound popup preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }

      .store-frame {
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 560px) 352px;
        align-items: center;
        justify-content: center;
        gap: 92px;
        padding: 0 72px;
      }

      .store-copy {
        align-self: center;
      }

      .store-eyebrow {
        margin: 0 0 18px;
        color: #0b6b5f;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .store-title {
        max-width: 520px;
        margin: 0;
        color: #16302d;
        font-size: 62px;
        font-weight: 760;
        letter-spacing: -0.045em;
        line-height: 0.98;
      }

      .store-description {
        max-width: 500px;
        margin: 26px 0 0;
        color: #43524f;
        font-size: 19px;
        line-height: 1.55;
      }

      .store-features {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 30px;
      }

      .store-feature {
        border: 1px solid #bfd0cc;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: #29433f;
        font-size: 13px;
        font-weight: 650;
        padding: 8px 13px;
      }

      .preview-stage {
        position: relative;
        width: 352px;
        height: 760px;
      }

      #root {
        position: absolute;
        top: 14px;
        left: 50%;
        width: 440px;
        transform: translateX(-50%) scale(0.76);
        transform-origin: top center;
      }
    </style>
  </head>
  <body>
    <main class="store-frame">
      <section class="store-copy" aria-label="Voxbound overview">
        <p class="store-eyebrow">Meeting notes with Open WebUI</p>
        <h1 class="store-title">Record. Transcribe. Keep the context.</h1>
        <p class="store-description">
          Capture tab audio, create structured notes through your Open WebUI setup, and keep meeting history in Chrome.
        </p>
        <div class="store-features" aria-label="Key features">
          <span class="store-feature">Tab + microphone audio</span>
          <span class="store-feature">Structured notes</span>
          <span class="store-feature">Markdown export</span>
        </div>
      </section>
      <section class="preview-stage" aria-label="Voxbound extension preview">
        <div id="root"></div>
      </section>
    </main>
    <script>
      (() => {
        const settings = {
          openWebuiBaseUrl: "http://localhost:3000",
          apiToken: "",
          model: "qwen2.5:7b-instruct",
          openWebuiKnowledgeSyncEnabled: false,
          openWebuiKnowledgeBaseName: "Voxbound Meetings",
          summaryPrompt: "Use only information from the transcript.",
          summaryNoteType: "auto",
          summaryLength: "short",
          summaryLanguage: "auto",
          summaryStrictness: "strict",
          sttEndpointPath: "/api/v1/audio/transcriptions",
          chatEndpointPath: "/api/chat/completions",
          locale: "en",
          liveTranscriptionEnabled: false
        };
        const store = {
          "meetingTranscriber.settings": settings,
          includeMic: false
        };
        const recordingSnapshot = {
          status: "idle",
          includeMic: false,
          micLevel: 0,
          micTrackActive: false
        };
        const processingState = {
          status: "idle",
          message: "",
          updatedAt: new Date().toISOString()
        };

        const originalFetch = window.fetch.bind(window);
        window.fetch = async (input, init) => {
          const url = new URL(typeof input === "string" ? input : input.url, window.location.href);
          if (url.origin === "http://localhost:3000") {
            if (url.pathname === "/api/models") {
              return new Response(JSON.stringify({ data: [{ id: settings.model, name: settings.model }] }), {
                status: 200,
                headers: { "Content-Type": "application/json" }
              });
            }
            return new Response("OK", { status: 200 });
          }
          return originalFetch(input, init);
        };

        window.chrome = {
          runtime: {
            getURL: (path) => new URL(`/${path}`, window.location.origin).href,
            openOptionsPage: async () => undefined,
            sendMessage: async (message) => {
              if (message?.type === "GET_PROCESSING_STATUS") {
                return { ok: true, data: processingState };
              }
              if (message?.type === "GET_LIVE_TRANSCRIPT") {
                return { ok: true, data: { segments: [], text: "" } };
              }
              return { ok: true, data: recordingSnapshot };
            }
          },
          storage: {
            local: {
              get: async (keys) => {
                if (typeof keys === "string") {
                  return { [keys]: store[keys] };
                }
                if (Array.isArray(keys)) {
                  return Object.fromEntries(keys.map((key) => [key, store[key]]));
                }
                if (keys && typeof keys === "object") {
                  return Object.fromEntries(Object.entries(keys).map(([key, fallback]) => [key, store[key] ?? fallback]));
                }
                return { ...store };
              },
              set: async (values) => Object.assign(store, values),
              remove: async (keys) => {
                for (const key of Array.isArray(keys) ? keys : [keys]) {
                  delete store[key];
                }
              }
            },
            onChanged: {
              addListener: () => undefined,
              removeListener: () => undefined
            }
          },
          tabs: {
            create: async () => undefined,
            update: async () => undefined
          },
          permissions: {
            request: async () => true
          }
        };
      })();
    </script>
    <script type="module" src="/src/popup/Popup.tsx"></script>
  </body>
</html>
