services:
  ollama:
    image: ollama/ollama:latest
    container_name: voxbound-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama

  open-webui:
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"

volumes:
  ollama-models:
