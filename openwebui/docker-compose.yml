services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: voxbound-open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      WEBUI_AUTH: "${WEBUI_AUTH:-true}"
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data:
